<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAP - Login</title>
    <link rel="stylesheet" href="/CSS/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/JS/config.js" defer></script>
    <script src="/JS/index.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon-box">
                    <i data-lucide="shield-check" class="icon"></i>
                </div>
                <h1 class="login-title">SGAP</h1>
                <p class="login-subtitle">Sistema de Gestão e Aplicação de Produtos</p>
            </div>

            <div class="login-body">
                <form id="loginForm" class="login-form" onsubmit="fazerLogin(event)" novalidate>
                    <!-- Campo Documento -->
                    <div class="form-group">
                        <label for="loginDoc" class="form-label">Documento (CPF)</label>
                        <div class="input-wrapper">
                            <i data-lucide="user" class="input-icon"></i>
                            <input 
                                type="text" 
                                id="loginDoc" 
                                required 
                                oninput="formatarCPF(event)" 
                                maxlength="14" 
                                autocomplete="username"
                                class="form-input" 
                                placeholder="Ex: 111.111.111-11"
                            >
                        </div>
                        <span id="error-loginDoc" class="error-message" aria-live="polite"></span>
                    </div>

                    <!-- Campo Senha -->
                    <div class="form-group">
                        <label for="loginSenha" class="form-label">Senha do Sistema</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input 
                                type="password" 
                                id="loginSenha" 
                                required 
                                oninput="validarSenha()"
                                onblur="validarSenha()"
                                autocomplete="current-password"
                                class="form-input input-with-action" 
                                placeholder="••••••••"
                            >
                            <button 
                                type="button" 
                                class="toggle-password-btn" 
                                onclick="alternarVisibilidadeSenha()" 
                                aria-label="Mostrar ou ocultar senha"
                            >
                                <i data-lucide="eye" id="toggleSenhaIcon"></i>
                            </button>
                        </div>
                        <span id="error-loginSenha" class="error-message" aria-live="polite"></span>
                    </div>

                    <!-- Campo 2FA -->
                    <div class="form-group">
                        <div class="label-header">
                            <div class="label-with-badge">
                                <label for="login2fa" class="form-label">Código 2FA</label>
                                <span class="badge-not-implemented">Não implementado ainda</span>
                            </div>
                            <a href="#" class="link-app">App Autenticador</a>
                        </div>
                        <div class="input-wrapper">
                            <i data-lucide="smartphone" class="input-icon"></i>
                            <input 
                                type="text" 
                                id="login2fa" 
                                disabled
                                class="form-input" 
                                placeholder="Indisponível no momento"
                            >
                        </div>
                    </div>

                    <button type="submit" id="btn-login" class="btn-submit">Acessar Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Popup de Erro -->
    <div id="errorModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <div class="modal-icon-box">
                <i data-lucide="alert-triangle" class="modal-icon"></i>
            </div>
            <h2 id="modalTitle" class="modal-title">Falha no Login</h2>
            <p id="modalMessage" class="modal-message">CPF ou senha incorretos.</p>
            <button type="button" id="btnCloseModal" class="modal-btn" onclick="fecharPopupErro()">
                Tentar Novamente
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
